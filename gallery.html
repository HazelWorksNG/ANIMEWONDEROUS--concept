<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="general.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/gallery.css">
    <script src="JS/loader.js" defer></script>
</head>
<body>
    <div class="page-loader" id="page-loader" aria-hidden="false">
        <div class="loader-content">
            <div class="loader-logo">
                <span class="mark">✦</span>
            </div>

            <div class="loader-brand">
                <strong>ANIMEWONDEROUS</strong>
                <small>THE HOME OF OTAKUS</small>
            </div>

            <div class="loader-progress">
                <span></span>
            </div>

            <small class="loader-message">
                PREPARING YOUR EXPERIENCE...
            </small>
        </div>
    </div>
    
    <!-- HEADER -->
    <header class="header" id="site-header" data-authenticated="false" data-tickets-available="true" data-show-ticket-button="true">

        <!-- BRAND -->
        <a class="brand" href="index.html">
            <span class="mark">卐</span>

            <span class="brand-text">
                <strong>ANIMEWONDEROUS</strong>
                <small>THE HOME OF OTAKUS</small>
            </span>
        </a>


        <!-- MOBILE MENU PANEL -->
        <div class="mobile-menu-panel" id="mobile-menu-panel">

            <!-- MAIN NAVIGATION -->
            <nav class="nav" id="main-navigation">
                <a class="active" href="index.html">Home</a>
                <a href="event.html">Events</a>
                <a href="shop.html">Shop</a>
                <a href="community.html">Community</a>
                <a href="about.html">About</a>
            </nav>


            <!-- HEADER ACTIONS -->
            <div class="actions" id="header-actions">

                <!-- SEARCH -->
                <form class="search-box" id="header-search" action="search.html" method="GET">

                    <button
                        type="button"
                        class="search-toggle"
                        id="search-toggle"
                        aria-label="Open search"
                        aria-expanded="false"
                    >
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-4-4"></path>
                        </svg>
                    </button>

                    <input
                        type="search"
                        name="q"
                        id="header-search-input"
                        placeholder="Search anime, events, merchandise..."
                        aria-label="Search Animewonderous"
                    >

                    <button
                        type="button"
                        class="search-close"
                        id="search-close"
                        aria-label="Close search"
                    >
                        &times;
                    </button>

                </form>


                <!-- CART -->
                <a href="cart.html" class="header-cart" aria-label="Shopping cart">
                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cart-count">0</span>
                </a>


                <!-- ACCOUNT ICON -->
                <a
                    href="account.html"
                    class="header-account"
                    id="header-account"
                    aria-label="My account"
                    hidden
                >
                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21a8 8 0 0 1 16 0"></path>
                    </svg>
                </a>


                <!-- TICKET BUTTON -->
                <a
                    href="ticket.html"
                    class="btn red header-ticket"
                    id="header-ticket"
                >
                    Get Tickets <span>↗</span>
                </a>

            </div>
        </div>


        <!-- MOBILE MENU BUTTON -->
        <button
            class="menu"
            id="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-controls="mobile-menu-panel"
            aria-expanded="false"
        >
            <svg class="icon-hamburger" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M3 6h18M3 12h18M3 18h18"></path>
            </svg>

            <svg class="icon-close" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="m18 6-12 12M6 6l12 12"></path>
            </svg>
        </button>

    </header>

    <script src="JS/header.js" defer></script>
</body>
</html>
